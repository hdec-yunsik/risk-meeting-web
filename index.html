<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>위험성평가 자료관리 4-3</title><style>
:root{--n:#071525;--b:#2563eb;--g:#059669;--r:#dc2626;--a:#d97706;--bg:#f1f5f9;--line:#dbe4ed;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Pretendard,"Noto Sans KR",Arial;color:#102033}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#071525,#163552)}.loginbox{width:390px;background:#fff;padding:28px;border-radius:20px}.loginbox input{width:100%;height:44px;border:1px solid var(--line);border-radius:9px;padding:0 10px;margin:5px 0 10px}.primary{border:0;background:var(--b);color:white;border-radius:9px;padding:10px 14px;font-weight:900}.secondary{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;font-weight:900}.err{color:var(--r);font-size:11px}.top{height:64px;background:var(--n);color:#fff;display:flex;align-items:center;padding:0 22px}.nav{margin:auto;display:flex;gap:4px;background:#102238;padding:4px;border-radius:10px}.nav button{border:0;background:transparent;color:#a6b4c4;border-radius:7px;padding:8px 15px;font-size:12px;font-weight:900}.nav button.active{background:#fff;color:#102033}.user{display:flex;gap:9px;align-items:center;font-size:11px}.wrap{max-width:1300px;margin:auto;padding:24px}.page{display:none}.page.active{display:block}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:15px}.hero h1{margin:0}.hero p{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr .85fr;gap:14px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 8px #1020330d}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}label{font-size:11px;font-weight:900;color:#475569}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;margin-top:5px}.company-head{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.checks{display:grid;gap:7px;margin-top:9px}.check{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:10px;padding:10px}.check input{width:18px;height:18px;margin:0}.check.selected{background:#eff6ff;border-color:#93c5fd}.actions{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}.meeting{display:grid;grid-template-columns:105px 1fr 88px;gap:10px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:12px;margin-top:8px}.pill{display:inline-block;padding:5px 8px;border-radius:99px;font-size:10px;font-weight:900}.weekly{background:#eff6ff;color:#1d4ed8}.monthly{background:#f5f3ff;color:#6d28d9}.draft{background:#f8fafc;color:#475569}.progress{background:#fffbeb;color:#b45309}.done{background:#ecfdf5;color:#047857}.submission{display:grid;grid-template-columns:220px 1fr;gap:14px}.side button{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px;margin-bottom:6px}.side button.active{background:var(--n);color:#fff}.upload{border:2px dashed #93c5fd;background:#eff6ff;color:#1d4ed8;border-radius:12px;padding:25px;text-align:center;display:block;margin-top:9px}.files{margin-top:8px}.file{display:flex;justify-content:space-between;border:1px solid var(--line);border-radius:9px;padding:9px;margin-top:5px;font-size:11px}.statrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.notice{background:#fffbeb;border:1px solid #fde68a;color:#854d0e;padding:10px;border-radius:9px;font-size:11px}.success{background:#ecfdf5;color:#047857;padding:10px;border-radius:9px;margin-top:9px;font-size:11px}@media(max-width:850px){.grid,.formgrid,.submission{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body>
<section id="login" class="login"><div class="loginbox"><h1>위험성평가 자료관리</h1><p>등록된 계정으로 로그인해주세요.</p><input id="email" type="email" placeholder="admin@gf32.com"><input id="password" type="password" placeholder="비밀번호"><button id="loginBtn" class="primary" style="width:100%">로그인</button><div id="error" class="err"></div></div></section>
<div id="app" class="hidden"><header class="top"><b>위험성평가 회의관리 · 4-3</b><nav class="nav"><button data-page="create" class="active">회의 생성</button><button data-page="submit">자료 등록</button></nav><div class="user"><span id="userName"></span><span id="role"></span><button id="logout" class="secondary">로그아웃</button></div></header>
<section id="createPage" class="page active"><main class="wrap"><div class="hero"><div><h1>새 회의 생성</h1><p>회의 일정과 참여 업체를 등록합니다.</p></div><button id="reload" class="secondary">새로고침</button></div><div class="grid"><section class="card"><div class="formgrid"><label>회의 유형<select id="type"><option value="weekly">주간 위험성평가</option><option value="monthly">월간 위험성평가</option></select></label><label>회의 날짜<input id="date" type="date"></label><label class="wide">회의 제목<input id="title" placeholder="예: 10월 1주차 주간 위험성평가"></label></div><div class="company-head"><h3>참여 업체</h3><label style="display:flex;gap:7px;align-items:center"><input id="selectAll" type="checkbox" style="width:18px;margin:0"> 전체 선택</label></div><div id="companyChecks" class="checks"></div><div class="actions"><button id="clear" class="secondary">초기화</button><button id="createMeeting" class="primary">회의 생성</button></div><div id="createResult"></div></section><aside class="card"><h2>최근 회의</h2><div id="recent"></div></aside></div></main></section>
<section id="submitPage" class="page"><main class="wrap"><div class="hero"><div><h1>업체 자료 등록</h1><p>위험성평가 Excel 원본과 전주 이행사진을 등록합니다.</p></div></div><div class="submission"><aside class="card side"><h3>참여 회의</h3><div id="submitMeetings"></div></aside><section class="card"><div id="submitEmpty" class="notice">왼쪽에서 회의를 선택해주세요.</div><div id="submitPanel" class="hidden"><div class="statrow"><span id="meetingType" class="pill"></span><span id="submitStatus" class="pill"></span></div><h2 id="submitTitle"></h2><p id="submitCompany" style="color:#64748b"></p><label class="upload" for="excelFile"><b>위험성평가 Excel 원본 업로드</b><br><small>.xls 또는 .xlsx, 20MB 이하</small></label><input id="excelFile" type="file" accept=".xls,.xlsx" hidden><div id="excelList" class="files"></div><label class="upload" for="photoFiles"><b>전주 이행여부 사진 등록</b><br><small>JPG, PNG, WEBP 여러 장 가능</small></label><input id="photoFiles" type="file" multiple accept="image/jpeg,image/png,image/webp" hidden><div id="photoList" class="files"></div><div class="actions"><button id="saveDraft" class="secondary">작성 중 저장</button><button id="submitDone" class="primary">업체 자료 제출 완료</button></div><div id="submitResult"></div></div></section></div></main></section></div>
<script>
const BASE='https://tmseargcnwtzwktdwrka.supabase.co',KEY='sb_publishable_vK8x03BsDKVao7G1s17BjQ_n1z1ZijM',BUCKET='risk-meeting-files';const $=x=>document.getElementById(x);let session=null,profile=null,companies=[],meetings=[],participations=[],active=null;
async function api(path,opt={}){const h={apikey:KEY,'Content-Type':'application/json',...(session?{Authorization:'Bearer '+session.access_token}:{}),...(opt.headers||{})};const r=await fetch(BASE+path,{...opt,headers:h}),t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw Error(d?.message||d?.error_description||d?.error||r.statusText);return d}
function state(s){return s==='completed'?['완료','done']:s==='in_progress'?['진행중','progress']:['초안','draft']}function submissionState(s){return s==='submitted'?['제출 완료','done']:s==='draft'?['작성 중','progress']:['미제출','draft']}
async function login(){try{session=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});profile=(await api(`/rest/v1/profiles?id=eq.${session.user.id}&select=*,companies(company_name)`))[0];if(!profile)throw Error('프로필이 없습니다.');localStorage.setItem('meeting_43_session',JSON.stringify(session));$('login').classList.add('hidden');$('app').classList.remove('hidden');$('userName').textContent=profile.full_name;$('role').textContent=profile.role==='admin'?'관리자':profile.companies?.company_name;applyRole();await load()}catch(e){$('error').textContent=e.message}}
function applyRole(){const admin=profile.role==='admin';document.querySelector('[data-page="create"]').classList.toggle('hidden',!admin);if(!admin)showPage('submit')}
async function boot(){try{session=JSON.parse(localStorage.getItem('meeting_43_session'));if(!session)return;profile=(await api(`/rest/v1/profiles?id=eq.${session.user.id}&select=*,companies(company_name)`))[0];if(!profile)throw Error();$('login').classList.add('hidden');$('app').classList.remove('hidden');$('userName').textContent=profile.full_name;$('role').textContent=profile.role==='admin'?'관리자':profile.companies?.company_name;applyRole();await load()}catch{localStorage.removeItem('meeting_43_session')}}
function showPage(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(p+'Page').classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p))}
async function load(){companies=await api('/rest/v1/companies?is_active=eq.true&select=*&order=display_order.asc');meetings=await api('/rest/v1/meetings?select=*&order=meeting_date.desc');participations=await api('/rest/v1/meeting_companies?select=*,companies(*),meetings(*)&order=created_at.desc');renderCreate();renderSubmit()}
function renderCreate(){$('companyChecks').innerHTML=companies.map(c=>`<label class="check"><input type="checkbox" value="${c.id}"><b>${c.company_name}</b></label>`).join('');document.querySelectorAll('#companyChecks input').forEach(x=>x.onchange=()=>{x.closest('.check').classList.toggle('selected',x.checked);syncAll()});$('recent').innerHTML=meetings.slice(0,10).map(m=>{let t=m.meeting_type==='weekly'?['주간','weekly']:['월간','monthly'],s=state(m.status);return `<div class="meeting"><b>${m.meeting_date}</b><div><span class="pill ${t[1]}">${t[0]}</span><div style="font-weight:900;margin-top:5px">${m.title}</div></div><span class="pill ${s[1]}">${s[0]}</span></div>`}).join('')}
function syncAll(){const a=[...document.querySelectorAll('#companyChecks input')];$('selectAll').checked=a.length&&a.every(x=>x.checked);$('selectAll').indeterminate=a.some(x=>x.checked)&&!a.every(x=>x.checked)}$('selectAll').onchange=e=>{document.querySelectorAll('#companyChecks input').forEach(x=>{x.checked=e.target.checked;x.closest('.check').classList.toggle('selected',x.checked)});e.target.indeterminate=false};
async function createMeeting(){let body={p_meeting_type:$('type').value,p_title:$('title').value.trim(),p_meeting_date:$('date').value||null,p_period_start:null,p_period_end:null,p_company_ids:[...document.querySelectorAll('#companyChecks input:checked')].map(x=>x.value),p_common_theme_title:null,p_common_theme_content:null,p_common_notice:null,p_start_now:false};if(!body.p_title||!body.p_meeting_date||!body.p_company_ids.length)return $('createResult').innerHTML='<div class="err">제목, 날짜, 업체를 입력해주세요.</div>';try{let id=await api('/rest/v1/rpc/create_meeting_with_companies',{method:'POST',body:JSON.stringify(body)});$('createResult').innerHTML=`<div class="success">회의가 생성되었습니다. ID: ${id}</div>`;await load()}catch(e){$('createResult').innerHTML=`<div class="err">${e.message}</div>`}}
function renderSubmit(){$('submitMeetings').innerHTML=participations.map(p=>{let s=submissionState(p.submission_status);return `<button data-id="${p.id}"><b>${p.meetings.meeting_date}</b><br>${p.meetings.title}<br><small>${p.companies.company_name} · <span class="pill ${s[1]}">${s[0]}</span></small></button>`}).join('');document.querySelectorAll('#submitMeetings button').forEach(b=>b.onclick=()=>selectParticipation(b.dataset.id))}
async function selectParticipation(id){active=participations.find(x=>x.id===id);document.querySelectorAll('#submitMeetings button').forEach(x=>x.classList.toggle('active',x.dataset.id===id));$('submitEmpty').classList.add('hidden');$('submitPanel').classList.remove('hidden');let t=active.meetings.meeting_type==='weekly'?['주간','weekly']:['월간','monthly'],s=submissionState(active.submission_status);$('meetingType').className='pill '+t[1];$('meetingType').textContent=t[0];$('submitStatus').className='pill '+s[1];$('submitStatus').textContent=s[0];$('submitTitle').textContent=active.meetings.title;$('submitCompany').textContent=active.companies.company_name;await loadFiles()}
async function loadFiles(){let list=await api(`/rest/v1/attachments?meeting_id=eq.${active.meeting_id}&company_id=eq.${active.company_id}&select=*`);$('excelList').innerHTML=list.filter(x=>x.attachment_type==='risk_document').map(x=>`<div class="file"><span>📊 ${x.original_name}</span><span>${new Date(x.created_at).toLocaleString()}</span></div>`).join('');$('photoList').innerHTML=list.filter(x=>x.attachment_type==='field_check').map(x=>`<div class="file"><span>🖼 ${x.original_name}</span><span>${new Date(x.created_at).toLocaleString()}</span></div>`).join('')}
async function upload(file,type){if(!active||!file)return;let folder=type==='risk_document'?'risk-documents':'field-checks',safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=`meetings/${active.meeting_id}/companies/${active.company_id}/${folder}/${Date.now()}-${safe}`;let r=await fetch(`${BASE}/storage/v1/object/${BUCKET}/${path}`,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':file.type,'x-upsert':'false'},body:file}),t=await r.text();if(!r.ok)throw Error(JSON.parse(t).message||t);await api('/rest/v1/attachments',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({meeting_id:active.meeting_id,company_id:active.company_id,attachment_type:type,bucket_id:BUCKET,object_path:path,original_name:file.name,mime_type:file.type,file_size:file.size,uploaded_by:profile.id})})}
async function uploadMany(files,type){try{for(const f of files)await upload(f,type);await setStatus('draft');await loadFiles();$('submitResult').innerHTML='<div class="success">파일을 업로드했습니다.</div>'}catch(e){$('submitResult').innerHTML=`<div class="err">업로드 실패: ${e.message}</div>`}}
async function setStatus(s){if(!active)return;await api('/rest/v1/rpc/set_company_submission_status',{method:'POST',body:JSON.stringify({p_meeting_company_id:active.id,p_status:s})});active.submission_status=s;await load();active=participations.find(x=>x.id===active?.id)||active;if(active)await selectParticipation(active.id)}
$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('logout').onclick=()=>{localStorage.removeItem('meeting_43_session');location.reload()};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));$('createMeeting').onclick=createMeeting;$('reload').onclick=load;$('clear').onclick=()=>{['date','title'].forEach(x=>$(x).value='');document.querySelectorAll('#companyChecks input').forEach(x=>{x.checked=false;x.closest('.check').classList.remove('selected')});syncAll()};$('excelFile').onchange=e=>uploadMany([...e.target.files],'risk_document');$('photoFiles').onchange=e=>uploadMany([...e.target.files],'field_check');$('saveDraft').onclick=()=>setStatus('draft');$('submitDone').onclick=async()=>{try{await setStatus('submitted');$('submitResult').innerHTML='<div class="success">업체 자료 제출을 완료했습니다.</div>'}catch(e){$('submitResult').innerHTML=`<div class="err">${e.message}</div>`}};$('date').onchange=e=>{if(!$('title').value){let d=new Date(e.target.value+'T00:00:00');$('title').value=`${d.getMonth()+1}월 ${$('type').value==='weekly'?'주간':'월간'} 위험성평가`}};boot();
</script></body></html>
