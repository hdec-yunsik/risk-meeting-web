<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>위험성평가 회의 생성 4-2</title><style>
:root{--n:#071525;--b:#2563eb;--bg:#f1f5f9;--line:#dbe4ed;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Pretendard,"Noto Sans KR",Arial;color:#102033}button,input,select{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#071525,#163552)}.loginbox{width:390px;background:#fff;padding:28px;border-radius:20px}.loginbox input{width:100%;height:44px;padding:0 10px;border:1px solid var(--line);border-radius:9px;margin:5px 0 10px}.primary{border:0;background:var(--b);color:#fff;border-radius:9px;padding:11px 14px;font-weight:900;cursor:pointer}.primary:disabled{opacity:.55}.loginbox .primary{width:100%}.err{color:#dc2626;font-size:11px;margin-top:8px}.top{height:64px;background:var(--n);color:#fff;display:flex;align-items:center;padding:0 22px}.user{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:12px}.logout{border:1px solid #475569;color:#fff;background:#102238;border-radius:8px;padding:7px 10px}.wrap{max-width:1250px;margin:auto;padding:24px}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:15px}.hero h1{margin:0}.hero p{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr .8fr;gap:14px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 8px #1020330d}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.wide{grid-column:1/-1}label{font-size:11px;font-weight:900;color:#475569}input,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;margin-top:5px}.company-head{display:flex;justify-content:space-between;align-items:center;margin-top:20px}.company-head h3{margin:0}.select-all{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:900;color:#1d4ed8;cursor:pointer}.select-all input,.company input{width:18px;height:18px;margin:0}.companies{display:grid;gap:7px;margin-top:10px}.company{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:11px;cursor:pointer}.company.checked{background:#eff6ff;border-color:#93c5fd}.company span{font-weight:900}.order{margin-left:auto;font-size:10px;color:var(--muted)}.actions{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}.secondary{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 13px;font-weight:900;cursor:pointer}.meeting{display:grid;grid-template-columns:110px 1fr 85px;gap:10px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:12px;margin-top:8px}.pill{display:inline-block;padding:5px 8px;border-radius:99px;background:#eff6ff;color:#1d4ed8;font-size:10px;font-weight:900}.success{background:#ecfdf5;color:#047857;padding:11px;border-radius:9px;margin-top:10px;font-size:12px}.guide{background:#f8fafc;color:#475569;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:11px;line-height:1.55;margin-bottom:12px}@media(max-width:850px){.grid,.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body>
<section id="login" class="login"><div class="loginbox"><h1>위험성평가 회의 생성</h1><p>관리자 계정으로 로그인해주세요.</p><input id="email" type="email" value="admin@gf32.com"><input id="password" type="password" placeholder="비밀번호"><button id="loginBtn" class="primary">로그인</button><div id="error" class="err"></div></div></section>
<div id="app" class="hidden"><header class="top"><b>위험성평가 회의관리 · 4-2</b><div class="user"><span id="userName"></span><button id="logout" class="logout">로그아웃</button></div></header><main class="wrap"><div class="hero"><div><h1>새 회의 생성</h1><p>회의 일정과 참여 업체를 등록합니다.</p></div><button id="reload" class="secondary">목록 새로고침</button></div><div class="guide">회의 생성 시 상태는 자동으로 <b>초안(draft)</b>으로 저장됩니다. 공통 점검 테마와 전달사항은 회의일이 가까워졌을 때 기존 공통사항 메뉴에서 별도로 등록합니다.</div><div class="grid"><section class="card"><h2>회의 정보</h2><div class="formgrid"><label>회의 유형<select id="type"><option value="weekly">주간 위험성평가</option><option value="monthly">월간 위험성평가</option></select></label><label>회의 날짜<input id="date" type="date"></label><label class="wide">회의 제목<input id="title" placeholder="예: 10월 1주차 주간 위험성평가"></label></div><div class="company-head"><h3>참여 업체</h3><label class="select-all"><input id="selectAll" type="checkbox"> 전체 선택</label></div><div id="companies" class="companies"></div><div class="actions"><button id="clear" class="secondary">초기화</button><button id="create" class="primary">회의 생성</button></div><div id="result"></div></section><aside class="card"><h2>최근 회의</h2><div id="meetingList"></div></aside></div></main></div>
<script>
const BASE='https://tmseargcnwtzwktdwrka.supabase.co',KEY='sb_publishable_vK8x03BsDKVao7G1s17BjQ_n1z1ZijM';const $=x=>document.getElementById(x);let session=null,profile=null;
async function api(path,opt={}){const h={apikey:KEY,'Content-Type':'application/json',...(session?{Authorization:'Bearer '+session.access_token}:{}),...(opt.headers||{})};const r=await fetch(BASE+path,{...opt,headers:h}),t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw Error(d?.message||d?.error_description||d?.error||r.statusText);return d}
async function login(){try{$('error').textContent='';session=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});profile=(await api(`/rest/v1/profiles?id=eq.${session.user.id}&select=*`))[0];if(profile?.role!=='admin')throw Error('관리자 계정만 사용할 수 있습니다.');localStorage.setItem('meeting_42_session',JSON.stringify(session));$('login').classList.add('hidden');$('app').classList.remove('hidden');$('userName').textContent=profile.full_name;await load()}catch(e){$('error').textContent=e.message}}
async function boot(){try{session=JSON.parse(localStorage.getItem('meeting_42_session'));if(!session)return;profile=(await api(`/rest/v1/profiles?id=eq.${session.user.id}&select=*`))[0];if(profile?.role!=='admin')throw Error();$('login').classList.add('hidden');$('app').classList.remove('hidden');$('userName').textContent=profile.full_name;await load()}catch{localStorage.removeItem('meeting_42_session')}}
async function load(){const cs=await api('/rest/v1/companies?is_active=eq.true&select=*&order=display_order.asc');$('companies').innerHTML=cs.map(c=>`<label class="company"><input type="checkbox" value="${c.id}"><span>${c.company_name}</span><small class="order">참여</small></label>`).join('');bindChecks();const ms=await api('/rest/v1/meetings?select=*,meeting_companies(count)&order=meeting_date.desc&limit=10');$('meetingList').innerHTML=ms.map(m=>`<div class="meeting"><b>${m.meeting_date}</b><div><span class="pill">${m.meeting_type==='weekly'?'주간':'월간'}</span><div style="margin-top:5px;font-weight:900">${m.title}</div><small>${m.meeting_companies?.[0]?.count||0}개 업체</small></div><span class="pill">${m.status}</span></div>`).join('')}
function bindChecks(){document.querySelectorAll('#companies input').forEach(x=>x.onchange=()=>{x.closest('.company').classList.toggle('checked',x.checked);const all=[...document.querySelectorAll('#companies input')];$('selectAll').checked=all.length>0&&all.every(v=>v.checked);$('selectAll').indeterminate=all.some(v=>v.checked)&&!all.every(v=>v.checked)})}
$('selectAll').onchange=e=>{document.querySelectorAll('#companies input').forEach(x=>{x.checked=e.target.checked;x.closest('.company').classList.toggle('checked',x.checked)});e.target.indeterminate=false};
function values(){return{p_meeting_type:$('type').value,p_title:$('title').value.trim(),p_meeting_date:$('date').value||null,p_period_start:null,p_period_end:null,p_company_ids:[...document.querySelectorAll('#companies input:checked')].map(x=>x.value),p_common_theme_title:null,p_common_theme_content:null,p_common_notice:null,p_start_now:false}}
async function createMeeting(){const v=values();if(!v.p_title||!v.p_meeting_date||!v.p_company_ids.length)return $('result').innerHTML='<div class="err">제목, 날짜, 참여 업체를 입력해주세요.</div>';try{$('create').disabled=true;$('create').textContent='생성 중...';const id=await api('/rest/v1/rpc/create_meeting_with_companies',{method:'POST',body:JSON.stringify(v)});$('result').innerHTML=`<div class="success">회의가 초안 상태로 생성되었습니다.<br>ID: ${id}</div>`;clearForm();await load()}catch(e){$('result').innerHTML=`<div class="err">생성 실패: ${e.message}</div>`}finally{$('create').disabled=false;$('create').textContent='회의 생성'}}
function clearForm(){$('title').value='';$('date').value='';document.querySelectorAll('#companies input').forEach(x=>{x.checked=false;x.closest('.company').classList.remove('checked')});$('selectAll').checked=false;$('selectAll').indeterminate=false}
$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('create').onclick=createMeeting;$('clear').onclick=()=>{clearForm();$('result').innerHTML=''};$('reload').onclick=load;$('logout').onclick=()=>{localStorage.removeItem('meeting_42_session');location.reload()};$('date').onchange=e=>{if(!$('title').value){const d=new Date(e.target.value+'T00:00:00');$('title').value=`${d.getMonth()+1}월 ${$('type').value==='weekly'?'주간':'월간'} 위험성평가`}};$('type').onchange=()=>{if($('date').value){const d=new Date($('date').value+'T00:00:00');$('title').value=`${d.getMonth()+1}월 ${$('type').value==='weekly'?'주간':'월간'} 위험성평가`}};boot();
</script></body></html>
