<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회의 진행 5-1</title><style>
:root{--n:#071525;--b:#2563eb;--g:#059669;--r:#dc2626;--bg:#f1f5f9;--line:#dbe4ed;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Pretendard,"Noto Sans KR",Arial;color:#102033}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#071525,#173754)}.loginbox{width:390px;background:#fff;padding:28px;border-radius:20px}.loginbox input{width:100%;height:44px;border:1px solid var(--line);border-radius:9px;padding:0 10px;margin:5px 0 10px}.primary{border:0;background:var(--b);color:#fff;border-radius:9px;padding:10px 14px;font-weight:900}.secondary{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;font-weight:900}.top{height:64px;background:var(--n);color:#fff;padding:0 22px;display:flex;align-items:center}.user{margin-left:auto;display:flex;gap:9px;align-items:center;font-size:11px}.wrap{max-width:1500px;margin:auto;padding:20px}.layout{display:grid;grid-template-columns:270px 1fr;gap:15px}.card{background:#fff;border-radius:15px;box-shadow:0 2px 8px #1020330d;overflow:hidden}.side{padding:14px;position:sticky;top:15px;align-self:start}.side select{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px}.company{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px;margin-top:7px}.company.active{background:var(--n);color:#fff}.company.done{border-color:#86efac;background:#ecfdf5;color:#065f46}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:10px}.step{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;font-size:11px;font-weight:900}.step.active{background:var(--n);color:#fff}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}.hero h1{margin:0}.pill{padding:5px 8px;border-radius:99px;background:#eff6ff;color:#1d4ed8;font-size:10px;font-weight:900}.view{display:none}.view.active{display:block}.head{padding:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.content{padding:14px}.photoGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.photo{border:1px solid var(--line);border-radius:12px;overflow:hidden}.img{height:260px;background:#e2e8f0 center/cover no-repeat;cursor:zoom-in}.body{padding:11px}.riskGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.risk{border:1px solid var(--line);border-radius:12px;padding:12px}.risk.high{background:#fff6f6}.risk textarea,.risk input,.risk select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:6px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.before{background:#f8fafc;padding:9px;border-radius:8px;font-size:11px}.after{background:#eff6ff;padding:9px;border-radius:8px;font-size:11px}.checks{width:100%;border-collapse:collapse;font-size:12px}.checks th,.checks td{padding:9px;border-bottom:1px solid var(--line);text-align:left}.checks tr.selected{background:#ecfdf5}.summary textarea{width:100%;height:160px;border:1px solid var(--line);border-radius:10px;padding:10px}.audit{font-size:11px;border-left:3px solid #60a5fa;padding:8px 10px;margin:7px 0;background:#f8fafc}.zoom{display:none;position:fixed;inset:0;background:#000c;z-index:100;place-items:center}.zoom.show{display:grid}.zoom img{max-width:92vw;max-height:90vh;border-radius:10px}.error{background:#fef2f2;color:#b91c1c;padding:10px;border-radius:9px;margin-top:8px;font-size:11px}.success{background:#ecfdf5;color:#047857;padding:10px;border-radius:9px;margin-top:8px;font-size:11px}@media(max-width:950px){.layout{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}.photoGrid,.riskGrid{grid-template-columns:1fr}}</style></head><body>
<section id="login" class="login"><div class="loginbox"><h1>회의 진행</h1><p>관리자 계정으로 로그인해주세요.</p><input id="email" type="email" value="admin@gf32.com"><input id="password" type="password" placeholder="비밀번호"><button id="loginBtn" type="button" class="primary" style="width:100%">로그인</button><div id="loginError"></div></div></section>
<div id="app" class="hidden"><header class="top"><b>위험성평가 회의 진행 · 5-1</b><div class="user"><span id="userName"></span><button id="logout" type="button" class="secondary">로그아웃</button></div></header><main class="wrap"><div class="layout"><aside class="card side"><h3>회의 선택</h3><select id="meetingSelect"></select><h3>참여 업체</h3><div id="companies"></div></aside><section><div class="steps"><button class="step active" data-view="photos">1. 전주 이행사진</button><button class="step" data-view="risks">2. 개선대책 협의</button><button class="step" data-view="select">3. 차주 항목 지정</button><button class="step" data-view="summary">4. 총평·업체완료</button><button class="step" data-view="confirm">5. 결과 확정</button></div><div class="hero"><div><span id="meetingBadge" class="pill"></span><h1 id="title">회의를 선택해주세요.</h1><p id="sub"></p></div><span id="companyBadge" class="pill"></span></div>
<div id="photos" class="view active card"><div class="head"><h2>전주 이행여부 사진</h2></div><div id="photoGrid" class="content photoGrid"></div></div>
<div id="risks" class="view card"><div class="head"><div><h2>위험성평가 및 개선대책 수정</h2><small>저장 시 수정 전·후, 수정자, 시간이 기록됩니다.</small></div></div><div id="riskGrid" class="content riskGrid"></div></div>
<div id="select" class="view card"><div class="head"><h2>업체별 차주 점검 대상 지정</h2></div><div class="content"><h3>당사 선택 1건</h3><table class="checks"><tbody id="mainSelect"></tbody></table><h3>협력업체 선택 1건</h3><table class="checks"><tbody id="companySelectBody"></tbody></table><div id="selectStatus"></div></div></div>
<div id="summary" class="view card"><div class="head"><h2>총평 및 업체 회의 완료</h2></div><div class="content summary"><textarea id="overall" placeholder="회의 총평을 입력하면 자동 저장됩니다."></textarea><div id="summaryStatus"></div><div class="actions"><button id="completeCompany" type="button" class="primary">현재 업체 회의 완료</button></div><h3>최근 수정 이력</h3><div id="audit"></div></div></div>
<div id="confirm" class="view card"><div class="head"><h2>회의 결과 최종 확정</h2></div><div class="content"><p>모든 업체 회의가 완료되고 총평이 작성되어야 확정할 수 있습니다.</p><button id="confirmMeeting" type="button" class="primary">전체 회의 최종 확정</button><div id="confirmStatus"></div></div></div>
</section></div></main></div><div id="zoom" class="zoom" onclick="this.classList.remove('show')"><img id="zoomImg"></div>
<script>
const BASE='https://tmseargcnwtzwktdwrka.supabase.co',KEY='sb_publishable_vK8x03BsDKVao7G1s17BjQ_n1z1ZijM',BUCKET='risk-meeting-files';const $=x=>document.getElementById(x);let session,profile,meetings=[],parts=[],meeting,part,risks=[],checks=[],attachments=[],timer;const G={high:'상',medium:'중',low:'하'};
async function api(path,opt={}){let h={apikey:KEY,'Content-Type':'application/json',...(session?{Authorization:'Bearer '+session.access_token}:{}),...(opt.headers||{})},r=await fetch(BASE+path,{...opt,headers:h}),t=await r.text(),d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw Error(d?.message||d?.error_description||d?.error||r.statusText);return d}function msg(id,text,ok=false){$(id).innerHTML=`<div class="${ok?'success':'error'}">${text}</div>`}
async function login(){try{session=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});profile=(await api(`/rest/v1/profiles?id=eq.${session.user.id}&select=*`))[0];if(profile?.role!=='admin')throw Error('관리자 계정만 사용할 수 있습니다.');localStorage.setItem('meeting_51_session',JSON.stringify(session));open();await load()}catch(e){msg('loginError',/invalid login/i.test(e.message)?'아이디 또는 비밀번호가 올바르지 않습니다.':e.message)}}async function boot(){try{session=JSON.parse(localStorage.getItem('meeting_51_session'));if(!session)return;profile=(await api(`/rest/v1/profiles?id=eq.${session.user.id}&select=*`))[0];if(profile?.role!=='admin')throw Error();open();await load()}catch{localStorage.removeItem('meeting_51_session')}}function open(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('userName').textContent=profile.full_name}
async function load(){meetings=await api('/rest/v1/meetings?select=*&order=meeting_date.desc');$('meetingSelect').innerHTML=meetings.map(m=>`<option value="${m.id}">${m.meeting_date} · ${m.title}</option>`).join('');if(meetings[0])await selectMeeting(meetings[0].id)}async function selectMeeting(id){meeting=meetings.find(x=>x.id===id);$('meetingSelect').value=id;parts=await api(`/rest/v1/meeting_companies?meeting_id=eq.${id}&select=*,companies(*)&order=presentation_order.asc`);$('meetingBadge').textContent=meeting.status==='completed'?'확정 완료':'진행중';$('title').textContent=meeting.title;$('sub').textContent=meeting.meeting_date;$('overall').value=meeting.overall_comment||'';renderCompanies();if(parts[0])await selectCompany(parts[0].id)}function renderCompanies(){$('companies').innerHTML=parts.map(p=>`<button type="button" class="company ${p.id===part?.id?'active':''} ${p.status==='completed'?'done':''}" onclick="selectCompany('${p.id}')"><b>${p.companies.company_name}</b><br><small>${p.status==='completed'?'완료':'진행중'}</small></button>`).join('')}
async function selectCompany(id){part=parts.find(x=>x.id===id);renderCompanies();$('companyBadge').textContent=part.companies.company_name;await Promise.all([loadRisks(),loadChecks(),loadAttachments(),loadAudit()]);renderAll()}async function loadRisks(){risks=await api(`/rest/v1/risk_items?meeting_id=eq.${meeting.id}&company_id=eq.${part.company_id}&is_deleted=eq.false&select=*&order=sort_order.asc`)}async function loadChecks(){checks=await api(`/rest/v1/field_checks?meeting_id=eq.${meeting.id}&company_id=eq.${part.company_id}&select=*`)}async function loadAttachments(){attachments=await api(`/rest/v1/attachments?meeting_id=eq.${meeting.id}&company_id=eq.${part.company_id}&attachment_type=eq.field_check&select=*`)}async function loadAudit(){let a=await api(`/rest/v1/audit_logs?meeting_id=eq.${meeting.id}&select=*&order=created_at.desc&limit=15`);$('audit').innerHTML=a.map(x=>`<div class="audit"><b>${x.action}</b> · ${new Date(x.created_at).toLocaleString()}<br>${x.table_name}</div>`).join('')}
function renderAll(){renderPhotos();renderRisks();renderSelection();$('completeCompany').disabled=part.status==='completed'||meeting.status==='completed';$('confirmMeeting').disabled=meeting.status==='completed'}async function signed(p){let d=await api(`/storage/v1/object/sign/${BUCKET}/${p}`,{method:'POST',body:JSON.stringify({expiresIn:3600})});return BASE+'/storage/v1'+d.signedURL}async function renderPhotos(){$('photoGrid').innerHTML='';for(let f of attachments){let u=await signed(f.object_path),c=checks.find(x=>x.id===f.field_check_id),r=risks.find(x=>x.id===c?.risk_item_id);$('photoGrid').insertAdjacentHTML('beforeend',`<article class="photo"><div class="img" style="background-image:url('${u}')" onclick="zoom('${u}')"></div><div class="body"><b>${c?.selected_by==='main_contractor'?'당사 선택':'협력업체 선택'}</b><p>위험요인: ${r?.hazard||'-'}</p><p>개선대책: ${r?.improvement_measure||'-'}</p><p>코멘트: ${f.review_comment||'-'}</p></div></article>`) }if(!attachments.length)$('photoGrid').innerHTML='<div>등록된 현장사진이 없습니다. 사진 미등록 항목은 미실시로 봅니다.</div>'}function zoom(u){$('zoomImg').src=u;$('zoom').classList.add('show')}
function renderRisks(){$('riskGrid').innerHTML=risks.map(r=>`<article class="risk ${r.current_grade==='high'?'high':''}"><b>${r.work_activity}</b><div class="compare"><div class="before"><b>수정 전</b><br>위험요인: ${r.hazard}<br>대책: ${r.improvement_measure}<br>등급: ${G[r.current_grade]}</div><div class="after"><b>수정 후</b><textarea id="hz-${r.id}">${r.hazard}</textarea><textarea id="im-${r.id}">${r.improvement_measure}</textarea><select id="gr-${r.id}"><option value="high">상</option><option value="medium">중</option><option value="low">하</option></select><input id="rs-${r.id}" value="${r.change_reason||''}" placeholder="변경 사유"></div></div><button type="button" class="primary" onclick="saveRisk('${r.id}')">수정 저장</button><div id="st-${r.id}"></div></article>`).join('');risks.forEach(r=>$('gr-'+r.id).value=r.current_grade)}async function saveRisk(id){try{await api('/rest/v1/rpc/update_risk_item_in_meeting',{method:'POST',body:JSON.stringify({p_risk_item_id:id,p_hazard:$('hz-'+id).value,p_improvement_measure:$('im-'+id).value,p_current_grade:$('gr-'+id).value,p_change_reason:$('rs-'+id).value})});msg('st-'+id,'수정자와 수정시간을 기록했습니다.',true);await loadRisks();await loadAudit();renderRisks()}catch(e){msg('st-'+id,e.message)}}
function renderSelection(){let rows=who=>risks.map(r=>{let c=checks.find(x=>x.selected_by===who&&x.risk_item_id===r.id);return `<tr class="${c?'selected':''}" onclick="choose('${who}','${r.id}')"><td><input type="radio" ${c?'checked':''}></td><td>${r.work_activity}</td><td>${r.hazard}</td><td>${r.improvement_measure}</td><td>${G[r.current_grade]}</td></tr>`}).join('');$('mainSelect').innerHTML=rows('main_contractor');$('companySelectBody').innerHTML=rows('company')}
async function choose(who,rid){try{let old=checks.find(x=>x.selected_by===who);if(old)await api(`/rest/v1/field_checks?id=eq.${old.id}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({risk_item_id:rid,checked_at:new Date().toISOString()})});else await api('/rest/v1/field_checks',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({meeting_id:meeting.id,company_id:part.company_id,risk_item_id:rid,selected_by:who,result:'not_performed',checked_at:new Date().toISOString()})});await loadChecks();renderSelection();msg('selectStatus','차주 점검 대상을 지정했습니다.',true)}catch(e){msg('selectStatus',e.message)}}
async function saveComment(){try{await api('/rest/v1/rpc/save_meeting_comment',{method:'POST',body:JSON.stringify({p_meeting_id:meeting.id,p_comment:$('overall').value})});meeting.overall_comment=$('overall').value;msg('summaryStatus','총평 자동 저장됨',true)}catch(e){msg('summaryStatus',e.message)}}async function completeCompany(){try{await api('/rest/v1/rpc/complete_company_meeting',{method:'POST',body:JSON.stringify({p_meeting_company_id:part.id})});part.status='completed';renderCompanies();renderAll();msg('summaryStatus','현재 업체 회의를 완료했습니다.',true)}catch(e){msg('summaryStatus',e.message)}}async function confirmMeeting(){try{await api('/rest/v1/rpc/confirm_meeting_result',{method:'POST',body:JSON.stringify({p_meeting_id:meeting.id})});meeting.status='completed';$('meetingBadge').textContent='확정 완료';renderAll();msg('confirmStatus','회의 결과를 최종 확정했습니다.',true)}catch(e){msg('confirmStatus',e.message)}}
$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('logout').onclick=()=>{localStorage.removeItem('meeting_51_session');location.reload()};$('meetingSelect').onchange=e=>selectMeeting(e.target.value);document.querySelectorAll('.step').forEach(b=>b.onclick=()=>{document.querySelectorAll('.step').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===b.dataset.view))});$('overall').oninput=()=>{clearTimeout(timer);timer=setTimeout(saveComment,650)};$('completeCompany').onclick=completeCompany;$('confirmMeeting').onclick=confirmMeeting;boot();
</script></body></html>
