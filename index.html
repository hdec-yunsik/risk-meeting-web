<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>위험성평가 회의관리 2-7</title><style>
:root{--n:#071525;--b:#2563eb;--g:#059669;--r:#dc2626;--bg:#f1f5f9;--line:#dbe4ed;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#102033;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}button,input{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#071525,#173754)}.box{width:390px;background:#fff;border-radius:22px;padding:28px;box-shadow:0 25px 60px #0005}.box h1{margin:0 0 5px}.box p{font-size:12px;color:var(--muted)}label{display:block;margin-top:13px;font-size:11px;font-weight:900}.box input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 11px;margin-top:5px}.loginbtn{width:100%;height:45px;border:0;border-radius:10px;background:var(--b);color:#fff;font-weight:900;margin-top:18px;cursor:pointer}.loginbtn:disabled{opacity:.55}.err{min-height:18px;color:var(--r);font-size:11px;margin-top:8px;white-space:pre-wrap}.diag{font-size:10px;color:#64748b;background:#f8fafc;border-radius:8px;padding:8px;margin-top:8px}.top{height:64px;background:var(--n);color:#fff;display:flex;align-items:center;padding:0 22px}.brand{font-weight:900}.brand small{display:block;color:#94a3b8;font-size:10px}.user{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px}.logout{border:1px solid #475569;background:#102238;color:white;border-radius:8px;padding:7px 10px}.wrap{max-width:1600px;margin:auto;padding:18px}.status{display:flex;gap:8px;align-items:center;margin-bottom:12px}.dot{width:8px;height:8px;border-radius:50%;background:#10b981}.pill{padding:5px 9px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:10px;font-weight:900}.grid{display:grid;grid-template-columns:280px 1fr;gap:16px}.card{background:#fff;border-radius:16px;box-shadow:0 2px 8px #1020330d;overflow:hidden}.head{padding:15px;border-bottom:1px solid var(--line)}.head h2{font-size:16px;margin:0}.head p{font-size:11px;color:var(--muted);margin:4px 0 0}.list{padding:8px}.company{width:100%;border:1px solid transparent;background:#f8fafc;border-radius:11px;padding:12px;margin:4px 0;text-align:left;cursor:pointer}.company.active{background:var(--n);color:#fff}.company small{display:block;color:#64748b;margin-top:3px}.company.active small{color:#cbd5e1}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px}.metric{padding:14px}.metric small{color:var(--muted);font-weight:800}.metric strong{display:block;font-size:22px;margin-top:4px}table{width:100%;border-collapse:collapse;font-size:12px}th{background:#f8fafc;text-align:left;padding:10px;border-bottom:1px solid var(--line)}td{padding:10px;border-bottom:1px solid #edf1f5}.grade{padding:4px 7px;border-radius:99px;font-size:10px;font-weight:900}.high{background:#fef2f2;color:#b91c1c}.medium{background:#fff7ed;color:#c2410c}.low{background:#ecfdf5;color:#047857}.meetingcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}.meeting{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;cursor:pointer}.meeting.active{border-color:#2563eb;box-shadow:0 0 0 2px #2563eb22}.empty{padding:35px;text-align:center;color:#64748b}@media(max-width:900px){.grid{grid-template-columns:1fr}.metrics,.meetingcards{grid-template-columns:1fr 1fr}}</style></head><body>
<section id="loginPage" class="login"><div class="box"><h1>위험성평가 회의관리</h1><p>관리자 또는 협력업체 계정으로 로그인하세요.</p><label>이메일<input id="email" type="email" autocomplete="username" placeholder="admin@gf32.com"></label><label>비밀번호<input id="password" type="password" autocomplete="current-password"></label><button id="loginBtn" type="button" class="loginbtn">로그인</button><div id="error" class="err"></div><div id="diag" class="diag">로그인 모듈 준비 완료</div></div></section>
<div id="app" class="hidden"><header class="top"><div class="brand">위험성평가 회의관리<small>SUPABASE REST CONNECTED</small></div><div class="user"><span id="userName"></span><span id="role" class="pill"></span><button id="logout" class="logout">로그아웃</button></div></header><main class="wrap"><div class="status"><span class="dot"></span><b>Supabase 연결 정상</b><span id="loaded" class="pill"></span></div><div id="meetings" class="meetingcards"></div><div class="grid"><aside class="card"><div class="head"><h2>업체 목록</h2><p>RLS에 따라 접근 가능한 업체만 표시됩니다.</p></div><div id="companies" class="list"></div></aside><section><div id="metrics" class="metrics"></div><div class="card"><div class="head"><h2 id="title">위험성평가</h2><p>전주 점검횟수 내림차순</p></div><div style="overflow:auto"><table><thead><tr><th>작업활동</th><th>위험요인</th><th>전주</th><th>금주</th><th>개선대책</th><th>점검횟수</th><th>미실시</th></tr></thead><tbody id="riskBody"></tbody></table></div></div></section></div></main></div>
<script>
const BASE='https://tmseargcnwtzwktdwrka.supabase.co';const KEY='sb_publishable_vK8x03BsDKVao7G1s17BjQ_n1z1ZijM';const $=id=>document.getElementById(id);let token='',user=null,profile=null,meeting=null,meetingCompanies=[],activeCompany=null;const grade={high:'상',medium:'중',low:'하'};
function setDiag(t){$('diag').textContent=t}function showError(t){$('error').textContent=t||''}async function request(path,opt={}){const headers={apikey:KEY,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})};const res=await fetch(BASE+path,{...opt,headers});let body=null;const text=await res.text();try{body=text?JSON.parse(text):null}catch{body=text}if(!res.ok)throw new Error((body&&body.message)||(body&&body.error_description)||(body&&body.error)||`${res.status} ${res.statusText}`);return body}
async function login(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return showError('이메일과 비밀번호를 입력해주세요.');$('loginBtn').disabled=true;showError('');setDiag('Supabase Auth 로그인 요청 중...');try{const data=await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});token=data.access_token;user=data.user;localStorage.setItem('risk_session',JSON.stringify({access_token:data.access_token,refresh_token:data.refresh_token,user:data.user}));setDiag('로그인 성공, 프로필 확인 중...');await boot()}catch(e){showError('로그인 실패: '+e.message);setDiag('요청 실패. 이메일 확인 상태와 비밀번호를 확인하세요.')}finally{$('loginBtn').disabled=false}}
async function boot(){try{profile=(await request(`/rest/v1/profiles?id=eq.${user.id}&select=*,companies(company_name)`))[0];if(!profile)throw new Error('profiles에 연결된 사용자 정보가 없습니다.');$('loginPage').classList.add('hidden');$('app').classList.remove('hidden');$('userName').textContent=profile.full_name;$('role').textContent=profile.role==='admin'?'관리자':profile.companies?.company_name||'협력업체';await loadMeetings()}catch(e){showError('프로필/데이터 오류: '+e.message);localStorage.removeItem('risk_session');token='';user=null}}
async function resume(){const raw=localStorage.getItem('risk_session');if(!raw)return;try{const s=JSON.parse(raw);token=s.access_token;user=s.user;setDiag('저장된 로그인 세션 확인 중...');await boot()}catch{localStorage.removeItem('risk_session')}}
async function loadMeetings(){const list=await request('/rest/v1/meetings?select=*&order=meeting_date.desc');$('loaded').textContent=`회의 ${list.length}건`;$('meetings').innerHTML=list.map(m=>`<div class="meeting ${meeting?.id===m.id?'active':''}" data-id="${m.id}"><b>${m.meeting_date}</b><div style="margin-top:5px">${m.title}</div><small>${m.status}</small></div>`).join('');document.querySelectorAll('.meeting').forEach(el=>el.onclick=()=>openMeeting(list.find(x=>x.id===el.dataset.id)));meeting=list.find(x=>x.status==='in_progress')||list[0];if(meeting)await openMeeting(meeting)}
async function openMeeting(m){meeting=m;document.querySelectorAll('.meeting').forEach(x=>x.classList.toggle('active',x.dataset.id===m.id));meetingCompanies=await request(`/rest/v1/meeting_companies?meeting_id=eq.${m.id}&select=*,companies(*)&order=presentation_order.asc`);renderCompanies();if(meetingCompanies[0])await selectCompany(meetingCompanies[0])}
function renderCompanies(){$('companies').innerHTML=meetingCompanies.map(mc=>`<button class="company ${activeCompany?.company_id===mc.company_id?'active':''}" data-id="${mc.company_id}"><b>${mc.companies.company_name}</b><small>${mc.status} · 우선순위 ${mc.presentation_order||'-'}</small></button>`).join('');document.querySelectorAll('.company').forEach(el=>el.onclick=()=>selectCompany(meetingCompanies.find(x=>x.company_id===el.dataset.id)))}
async function selectCompany(mc){activeCompany=mc;renderCompanies();$('title').textContent=mc.companies.company_name+' 위험성평가';const risks=await request(`/rest/v1/risk_items?meeting_id=eq.${meeting.id}&company_id=eq.${mc.company_id}&is_deleted=eq.false&select=*&order=previous_check_count.desc`);$('metrics').innerHTML=`<div class="card metric"><small>위험요인</small><strong>${risks.length}건</strong></div><div class="card metric"><small>상등급</small><strong style="color:#dc2626">${risks.filter(x=>x.current_grade==='high').length}건</strong></div><div class="card metric"><small>점검합계</small><strong>${risks.reduce((s,x)=>s+x.previous_check_count,0)}회</strong></div><div class="card metric"><small>미실시</small><strong>${risks.reduce((s,x)=>s+x.previous_result_not_performed_count,0)}건</strong></div>`;$('riskBody').innerHTML=risks.length?risks.map(r=>`<tr><td>${r.work_activity}</td><td><b>${r.hazard}</b></td><td><span class="grade ${r.previous_grade}">${grade[r.previous_grade]||'-'}</span></td><td><span class="grade ${r.current_grade}">${grade[r.current_grade]}</span></td><td>${r.improvement_measure}</td><td>${r.previous_check_count}회</td><td>${r.previous_result_not_performed_count}건</td></tr>`).join(''):`<tr><td colspan="7" class="empty">접근 가능한 위험성평가가 없습니다.</td></tr>`}
$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();login()}};$('logout').onclick=()=>{localStorage.removeItem('risk_session');location.reload()};window.addEventListener('error',e=>{setDiag('스크립트 오류: '+e.message)});resume();
</script></body></html>
